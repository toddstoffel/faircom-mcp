name: Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: toddstoffelfaircom
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: faircomteam/faircom-mcp
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub repo description and README
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: toddstoffelfaircom
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: faircomteam/faircom-mcp
          short-description: Connect AI assistants and LLMs to FairCom databases with production-grade safety controls.
          readme-filepath: ./README.md
